<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="霓虹歸位 NEON SORT — 3D 賽博朋克分類／堆疊混合休閒解謎。3D cyberpunk sort / stack hybrid-casual puzzle.">
<title data-i18n="doc.title">NEON SORT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Crect x=%226%22 y=%228%22 width=%226%22 height=%2216%22 rx=%221%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Crect x=%2213%22 y=%2212%22 width=%226%22 height=%2212%22 rx=%221%22 fill=%22none%22 stroke=%22%23ff2bd6%22 stroke-width=%222%22/%3E%3Crect x=%2220%22 y=%226%22 width=%226%22 height=%2218%22 rx=%221%22 fill=%22none%22 stroke=%22%23ffe600%22 stroke-width=%222%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css?v=0.3.17">
<link rel="stylesheet" href="./css/game.css?v=0.3.16">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body class="in-menu">
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="hud-panel hud-left">
    <div class="stat"><div class="label" data-i18n="hud.stage"></div><div class="value big" id="hud-stage">1</div></div>
    <div class="stat"><div class="label" data-i18n="hud.moves"></div><div class="value" id="hud-moves">0</div></div>
  </div>
  <div class="hud-panel hud-right">
    <div class="stat"><div class="label" data-i18n="hud.score"></div><div class="value" id="hud-score">0</div></div>
  </div>
  <div class="hud-buttons top">
    <button id="btn-mute" class="icon-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
      <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
    </button>
    <button id="btn-pause" class="icon-btn" data-i18n-attr="title:pauseTip,aria-label:pauseTip"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  </div>
  <div class="hud-actions">
    <button class="neon-btn ghost tiny" id="btn-undo" data-no-input><span data-i18n="undo"></span><small>1×</small></button>
    <button class="neon-btn ghost tiny" id="btn-restart-hud" data-no-input><span data-i18n="restart"></span><small data-i18n="restartS"></small></button>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero menu-home">
  <div class="menu-top">
    <div class="menu-top-left"><button type="button" class="menu-icon-btn" id="btn-arcade-menu" data-i18n-attr="title:kit.arcadeMenu,aria-label:kit.arcadeMenu"></button></div>
    <div class="menu-top-right"></div>
  </div>
  <div class="menu-body">
    <div class="menu-mid">
      <div class="menu-brand">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 class="title glitch" data-i18n="title">霓虹歸位</h1>
        <div class="title-en" data-i18n="titleEn"></div>
        <p class="tagline" data-i18n="tagline"></p>
        <div id="start-trial" class="trial-note hidden"></div>
      </div>
      <div class="menu-cta">
        <button class="neon-btn" id="btn-play"><span data-i18n="play">開始</span><small data-i18n="playS">STAGE 1</small></button>
        <div class="menu-sec">
          <button class="neon-btn ghost" id="btn-stages"><span data-i18n="stages">揀關卡</span><small data-i18n="stagesS">1–8</small></button>
          <button class="neon-btn ghost" id="btn-endless"><span data-i18n="endless">無盡歸位</span><small data-i18n="endlessS">GENERATED</small></button>
        </div>
      </div>
    </div>
    <div class="menu-meta">
      <div class="hi-line"><span data-i18n="best"></span> <b id="start-best">0</b>　<span data-i18n="stars"></span> <b id="start-stars">0</b></div>
    </div>
  </div>
</div>

<div id="screen-stages" class="screen hidden">
  <div class="panel wide">
    <h2 class="title2" data-i18n="stages">揀關卡</h2>
    <div class="stage-grid" id="stage-grid"></div>
    <button class="neon-btn ghost" id="btn-stages-back"><span data-i18n="menu"></span><small data-i18n="menuS"></small></button>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-i18n="paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="resume"></span><small data-i18n="resumeS"></small></button>
    <button class="neon-btn ghost" id="btn-restart"><span data-i18n="restart"></span><small data-i18n="restartS"></small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="quit"></span><small data-i18n="quitS"></small></button>
  </div>
</div>

<div id="screen-over" class="screen hidden">
  <div class="panel">
    <h2 class="title2 glitch" data-i18n="over">過關</h2>
    <div class="title-en" data-i18n="overS"></div>
    <div class="hi-line"><span data-i18n="score"></span> <b id="over-score">0</b>　<span data-i18n="best"></span> <b id="over-best">0</b></div>
    <div class="hi-line"><span data-i18n="hud.moves"></span> <b id="over-moves">0</b>　<span id="over-stars">★★★</span></div>
    <p class="tagline" data-i18n="overNote"></p>
    <button class="neon-btn" id="btn-next"><span data-i18n="next"></span><small data-i18n="nextS"></small></button>
    <button class="neon-btn ghost" id="btn-retry"><span data-i18n="retry"></span><small data-i18n="retryS"></small></button>
    <button class="neon-btn ghost" id="btn-menu"><span data-i18n="menu"></span><small data-i18n="menuS"></small></button>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
